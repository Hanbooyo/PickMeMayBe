<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PickMeMaybe Manual Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, "Noto Sans KR", sans-serif;
        background: #0f172a;
        color: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0f172a;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: #1e293b;
        color: #e5e7eb;
        border-radius: 6px;
        padding: 9px 12px;
        cursor: pointer;
      }

      button.primary {
        background: #b91c1c;
        border-color: #ef4444;
        font-weight: 800;
      }

      button.icon {
        width: 38px;
        height: 38px;
        padding: 0;
      }

      input {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: #020617;
        color: #f8fafc;
        border-radius: 6px;
        padding: 9px 10px;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        padding: 22px 28px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.22);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0;
      }

      .badge {
        color: #fecaca;
        border: 1px solid rgba(248, 113, 113, 0.55);
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 13px;
        font-weight: 800;
      }

      main {
        display: grid;
        grid-template-columns: minmax(520px, 0.95fr) minmax(420px, 1.05fr);
        min-height: 0;
      }

      .panel {
        padding: 24px;
        min-width: 0;
      }

      .panel + .panel {
        border-left: 1px solid rgba(148, 163, 184, 0.22);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
      }

      .table {
        display: grid;
        gap: 8px;
      }

      .row {
        display: grid;
        grid-template-columns: 48px 1fr 1.2fr 0.9fr 0.9fr 42px;
        gap: 8px;
        align-items: center;
      }

      .row.head {
        color: #94a3b8;
        font-size: 13px;
        font-weight: 800;
        padding: 0 4px;
      }

      .number {
        color: #cbd5e1;
        text-align: center;
      }

      .error {
        margin-top: 14px;
        color: #fecaca;
        min-height: 22px;
      }

      .preview {
        aspect-ratio: 16 / 9;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: rgba(2, 6, 23, 0.78);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
      }

      .preview header {
        padding: 16px 18px;
      }

      .preview h2 {
        margin: 0;
        font-size: 22px;
      }

      .preview-body {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 18px;
        padding: 18px;
        min-height: 0;
      }

      .candidates {
        display: grid;
        gap: 10px;
        align-content: start;
      }

      .candidate {
        display: grid;
        grid-template-columns: 54px 1fr 88px;
        gap: 12px;
        align-items: center;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 8px;
        padding: 9px;
        background: rgba(15, 23, 42, 0.66);
      }

      .candidate.winner {
        border-color: rgba(250, 204, 21, 0.95);
        background: linear-gradient(90deg, rgba(113, 63, 18, 0.62), rgba(15, 23, 42, 0.75));
      }

      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #334155;
        color: #f8fafc;
        font-weight: 900;
      }

      .name {
        font-size: 18px;
        font-weight: 900;
      }

      .meta {
        margin-top: 3px;
        color: #cbd5e1;
        font-size: 12px;
      }

      .bar {
        height: 10px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.25);
        overflow: hidden;
      }

      .bar span {
        display: block;
        width: 72%;
        height: 100%;
        background: linear-gradient(90deg, #38bdf8, #facc15);
      }

      .winner-panel {
        display: grid;
        align-content: center;
        justify-items: center;
        text-align: center;
        border-left: 1px solid rgba(148, 163, 184, 0.18);
        padding-left: 18px;
      }

      .winner-label {
        color: #fde68a;
        font-size: 16px;
        font-weight: 900;
      }

      .winner-name {
        margin-top: 8px;
        font-size: 44px;
        font-weight: 900;
      }

      .preview footer {
        padding: 12px 18px;
        background: rgba(185, 28, 28, 0.95);
        font-weight: 800;
      }

      @media (max-width: 980px) {
        main {
          grid-template-columns: 1fr;
        }

        .panel + .panel {
          border-left: 0;
          border-top: 1px solid rgba(148, 163, 184, 0.22);
        }

        .row {
          grid-template-columns: 36px 1fr;
        }

        .row.head {
          display: none;
        }

        .row input,
        .row button {
          grid-column: 2;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>PickMeMaybe</h1>
        <div class="badge">MANUAL RAFFLE PREVIEW</div>
      </header>
      <main>
        <section class="panel">
          <div class="toolbar">
            <button id="add-row" type="button">+ 참가자 추가</button>
            <button id="remove-last-row" type="button">- 마지막 행 제거</button>
            <button id="run-preview" class="primary" type="button">추첨 실행</button>
          </div>
          <div class="table" id="participant-table"></div>
          <div class="error" id="error-message"></div>
        </section>
        <section class="panel">
          <div class="preview" id="preview"></div>
        </section>
      </main>
    </div>
    <script type="module" src="../../dist/apps/web/src/index.js"></script>
  </body>
</html>
