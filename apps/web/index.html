<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PickMeMaybe Manual Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, "Noto Sans KR", sans-serif;
        background: #e6f6ff;
        color: #06324a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 18% 16%, rgba(255, 255, 255, 0.82), transparent 24%),
          radial-gradient(circle at 82% 12%, rgba(0, 140, 203, 0.18), transparent 26%),
          linear-gradient(135deg, #edfaff 0%, #c8ecff 56%, #f5fcff 100%);
      }

      button,
      input,
      select {
        font: inherit;
      }

      textarea {
        width: 100%;
        min-height: 108px;
        resize: vertical;
        border: 1px solid rgba(0, 140, 203, 0.22);
        background: rgba(255, 255, 255, 0.86);
        color: #06324a;
        border-radius: 24px;
        padding: 14px 16px;
        font: inherit;
        margin-bottom: 10px;
      }

      button {
        border: 1px solid rgba(0, 140, 203, 0.24);
        background: rgba(255, 255, 255, 0.86);
        color: #075985;
        border-radius: 999px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: 800;
        box-shadow: 0 10px 22px rgba(0, 103, 148, 0.12);
      }

      button.primary {
        background: linear-gradient(135deg, #008ccb, #00b4d8);
        border-color: rgba(0, 140, 203, 0.42);
        color: #fff;
        font-weight: 900;
      }

      button.icon {
        width: 40px;
        height: 40px;
        padding: 0;
      }

      input,
      select {
        width: 100%;
        border: 1px solid rgba(0, 140, 203, 0.22);
        background: rgba(255, 255, 255, 0.9);
        color: #06324a;
        border-radius: 999px;
        padding: 10px 14px;
      }

      label {
        display: inline-grid;
        gap: 5px;
        color: #0f5f86;
        font-size: 13px;
        font-weight: 800;
      }

      .winner-count {
        width: 118px;
      }

      .checkbox-label {
        grid-auto-flow: column;
        align-items: center;
      }

      .checkbox-label input {
        width: 18px;
        height: 18px;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        width: min(1180px, calc(100% - 48px));
        margin: 0 auto;
        padding: 34px 0;
      }

      header {
        width: fit-content;
        min-width: 320px;
        padding: 24px 30px;
        border: 1px solid rgba(255, 255, 255, 0.88);
        border-radius: 44px 44px 44px 10px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 22px 44px rgba(0, 103, 148, 0.18);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      h1 {
        margin: 0;
        color: #075985;
        font-size: 30px;
        letter-spacing: 0;
      }

      .badge {
        color: #008ccb;
        border: 1px solid rgba(0, 140, 203, 0.38);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 900;
      }

      main {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
        margin-top: 30px;
        border: 14px solid rgba(0, 140, 203, 0.34);
        border-radius: 36px;
        background: rgba(255, 255, 255, 0.44);
        box-shadow: 0 24px 60px rgba(0, 103, 148, 0.16);
      }

      .tabs {
        display: flex;
        gap: 8px;
        justify-content: center;
        padding: 18px 24px 0;
      }

      .tab-button {
        min-width: 128px;
        border-color: rgba(0, 140, 203, 0.18);
        background: rgba(255, 255, 255, 0.72);
        color: #0f5f86;
        font-weight: 900;
      }

      .tab-button.active {
        border-color: rgba(0, 140, 203, 0.42);
        background: linear-gradient(135deg, #008ccb, #00b4d8);
        color: #fff;
      }

      .tab-panel {
        display: none;
        min-height: 0;
      }

      .tab-panel.active {
        display: block;
      }

      .panel {
        padding: 28px;
        min-width: 0;
      }

      .draw-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        gap: 18px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
        justify-content: center;
      }

      .table {
        display: grid;
        gap: 8px;
      }

      .row {
        display: grid;
        grid-template-columns: 48px 1fr 1.2fr 0.9fr 0.9fr 42px;
        gap: 8px;
        align-items: center;
      }

      .row.head {
        color: #94a3b8;
        font-size: 13px;
        font-weight: 800;
        padding: 0 4px;
      }

      .number {
        color: #0f5f86;
        text-align: center;
        font-weight: 900;
      }

      .error {
        margin-top: 14px;
        color: #be123c;
        min-height: 22px;
      }

      .history {
        margin-top: 18px;
        display: grid;
        gap: 8px;
      }

      .resource-panel {
        margin-top: 18px;
        display: grid;
        gap: 8px;
      }

      .asset-match-panel {
        margin-top: 18px;
        display: grid;
        gap: 8px;
      }

      .resource-summary {
        color: #075985;
        border: 1px solid rgba(0, 140, 203, 0.16);
        background: rgba(255, 255, 255, 0.72);
        border-radius: 22px;
        padding: 12px 16px;
        font-size: 13px;
      }

      .resource-files {
        margin-top: 6px;
        color: #407c9e;
        overflow-wrap: anywhere;
      }

      .asset-match-list {
        display: grid;
        gap: 8px;
      }

      .asset-match-summary {
        color: #075985;
        border: 1px solid rgba(0, 140, 203, 0.16);
        background: rgba(255, 255, 255, 0.72);
        border-radius: 22px;
        padding: 12px 16px;
        font-size: 13px;
      }

      .asset-match-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        border: 1px solid rgba(0, 140, 203, 0.16);
        background: rgba(255, 255, 255, 0.72);
        border-radius: 22px;
        padding: 12px 16px;
      }

      .asset-match-name {
        color: #06324a;
        font-weight: 900;
      }

      .asset-match-path {
        margin-top: 4px;
        color: #407c9e;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .asset-match-status {
        color: #008ccb;
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .history-title {
        color: #35799d;
        font-size: 13px;
        font-weight: 800;
      }

      .history-item {
        border: 1px solid rgba(0, 140, 203, 0.16);
        background: rgba(255, 255, 255, 0.72);
        border-radius: 22px;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      .history-winner {
        color: #008ccb;
        font-weight: 900;
      }

      .history-time {
        color: #407c9e;
        font-size: 12px;
        white-space: nowrap;
      }

      .status {
        margin-bottom: 14px;
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #0f5f86;
        border: 1px solid rgba(0, 140, 203, 0.16);
        background: rgba(255, 255, 255, 0.72);
        border-radius: 999px;
        padding: 10px 14px;
      }

      .status strong {
        color: #06324a;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #f59e0b;
        flex: 0 0 auto;
      }

      .status.ready .status-dot {
        background: #22c55e;
      }

      .status.error .status-dot {
        background: #ef4444;
      }

      .preview {
        aspect-ratio: 16 / 9;
        border: 10px solid rgba(0, 140, 203, 0.42);
        background:
          radial-gradient(circle at 82% 22%, rgba(0, 180, 216, 0.24), transparent 26%),
          linear-gradient(135deg, #023047, #00689b 48%, #008ccb);
        border-radius: 28px;
        display: grid;
        place-items: center;
        overflow: hidden;
        box-shadow: 0 24px 56px rgba(0, 103, 148, 0.28);
      }

      .preview header {
        padding: 16px 18px;
      }

      .preview h2 {
        margin: 0;
        font-size: 22px;
      }

      .preview-body {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(180px, 0.75fr);
        gap: 18px;
        padding: 18px;
        min-height: 0;
      }

      .candidates {
        display: grid;
        gap: 10px;
        align-content: start;
        min-height: 0;
        overflow: auto;
        padding-right: 4px;
      }

      .candidate {
        display: grid;
        grid-template-columns: 46px minmax(0, 1fr) 74px;
        gap: 12px;
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 9px;
        background: rgba(255, 255, 255, 0.12);
      }

      .candidate.winner {
        border-color: rgba(0, 180, 216, 0.95);
        background: linear-gradient(90deg, rgba(0, 140, 203, 0.5), rgba(2, 48, 71, 0.72));
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 999px;
        object-fit: cover;
        display: grid;
        place-items: center;
        background: #334155;
        color: #f8fafc;
        font-weight: 900;
      }

      .name {
        font-size: 16px;
        font-weight: 900;
        overflow-wrap: anywhere;
      }

      .meta {
        margin-top: 3px;
        color: #cbd5e1;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .bar {
        height: 10px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.25);
        overflow: hidden;
      }

      .bar span {
        display: block;
        width: 72%;
        height: 100%;
        background: linear-gradient(90deg, #caf0f8, #008ccb);
      }

      .winner-panel {
        display: grid;
        align-content: center;
        justify-items: center;
        text-align: center;
        border-left: 1px solid rgba(148, 163, 184, 0.18);
        padding-left: 18px;
        min-width: 0;
        overflow: hidden;
      }

      .winner-label {
        color: #caf0f8;
        font-size: 16px;
        font-weight: 900;
      }

      .winner-name {
        margin-top: 8px;
        max-width: 100%;
        font-size: clamp(22px, 4vw, 44px);
        font-weight: 900;
        line-height: 1.08;
        overflow-wrap: anywhere;
      }

      .preview footer {
        padding: 12px 18px;
        background: rgba(0, 140, 203, 0.96);
        font-weight: 800;
      }

      .winner-only-stage {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 18px;
        padding: 28px;
        text-align: center;
      }

      .mode-chip {
        display: inline-grid;
        place-items: center;
        min-width: 126px;
        padding: 9px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        color: #caf0f8;
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .winner-grid {
        width: min(92%, 720px);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
      }

      .reveal-accent {
        min-width: 180px;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(202, 240, 248, 0.16);
        color: #f8fafc;
        font-size: 18px;
        font-weight: 900;
      }

      .vote-result-board {
        width: min(86%, 520px);
        display: grid;
        gap: 10px;
        padding: 14px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.12);
      }

      .vote-result-row {
        position: relative;
        display: grid;
        grid-template-columns: 92px 1fr;
        align-items: center;
        gap: 10px;
        color: #caf0f8;
        font-size: 13px;
        font-weight: 900;
        text-align: left;
      }

      .vote-result-row strong {
        position: relative;
        display: block;
        height: 18px;
        border-radius: 999px;
        overflow: hidden;
        isolation: isolate;
        color: #f8fafc;
        font-size: 11px;
        line-height: 18px;
        padding-right: 8px;
        text-align: right;
        background: rgba(255, 255, 255, 0.16);
      }

      .vote-result-row strong::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--vote-width);
        border-radius: inherit;
        background: linear-gradient(90deg, #caf0f8, #00b4d8);
        animation: result-vote-fill 0.9s ease-out both;
        z-index: -1;
      }

      .race-result-board {
        width: min(88%, 560px);
        padding: 16px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.12);
      }

      .race-result-track {
        position: relative;
        height: 96px;
        border-radius: 24px;
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.14) 0,
            rgba(255, 255, 255, 0.14) 1px,
            transparent 1px,
            transparent 32px
          );
        overflow: hidden;
      }

      .race-result-track strong {
        position: absolute;
        top: 0;
        right: 18px;
        bottom: 0;
        display: grid;
        place-items: center;
        writing-mode: vertical-rl;
        color: #caf0f8;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 2px;
      }

      .race-result-runner {
        position: absolute;
        left: 10%;
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: rgba(202, 240, 248, 0.34);
        color: #f8fafc;
        font-size: 13px;
        font-weight: 900;
      }

      .race-result-runner.first {
        top: 10px;
        animation: race-result-first 1s ease-out both;
      }

      .race-result-runner.second {
        top: 38px;
        animation: race-result-second 1s ease-out both;
      }

      .race-result-runner.third {
        top: 66px;
        animation: race-result-third 1s ease-out both;
      }

      .ladder-result-board {
        width: min(84%, 420px);
        padding: 16px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.12);
      }

      .ladder-result-path {
        position: relative;
        height: 132px;
      }

      .ladder-vertical {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 5px;
        border-radius: 999px;
        background: rgba(202, 240, 248, 0.82);
      }

      .ladder-vertical.left {
        left: 18%;
      }

      .ladder-vertical.center {
        left: 50%;
      }

      .ladder-vertical.right {
        left: 82%;
      }

      .ladder-step {
        position: absolute;
        height: 5px;
        border-radius: 999px;
        background: #caf0f8;
        animation: ladder-result-trace 0.9s ease-out both;
      }

      .ladder-step.one {
        top: 28px;
        left: 18%;
        width: 32%;
      }

      .ladder-step.two {
        top: 64px;
        left: 50%;
        width: 32%;
        animation-delay: 0.14s;
      }

      .ladder-step.three {
        top: 100px;
        left: 18%;
        width: 64%;
        animation-delay: 0.28s;
      }

      .ladder-result-path strong {
        position: absolute;
        right: 0;
        bottom: 0;
        padding: 7px 12px;
        border-radius: 999px;
        background: #f8fafc;
        color: #008ccb;
        font-size: 13px;
        font-weight: 900;
      }

      .dice-result {
        width: 82px;
        height: 82px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #f8fafc;
        color: #008ccb;
        font-size: 34px;
        font-weight: 900;
        box-shadow: 0 18px 34px rgba(2, 48, 71, 0.24);
      }

      .rps-result-board {
        width: min(86%, 430px);
        display: grid;
        gap: 12px;
        padding: 16px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.12);
      }

      .rps-bracket {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
      }

      .rps-token {
        height: 72px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        font-size: 38px;
        animation: rps-result-clash 0.72s ease-out both;
      }

      .rps-token.right {
        animation-delay: 0.12s;
      }

      .rps-versus {
        color: #caf0f8;
        font-size: 16px;
        font-weight: 900;
      }

      .rps-winner-line {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        justify-self: center;
        min-width: 150px;
        padding: 10px 16px;
        border-radius: 999px;
        background: #f8fafc;
        color: #008ccb;
        font-size: 24px;
        font-weight: 900;
        box-shadow: 0 18px 34px rgba(2, 48, 71, 0.24);
        animation: rps-result-win 0.72s 0.36s ease-out both;
      }

      .rps-winner-line span {
        font-size: 30px;
      }

      .dice-result-board {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .dice-result.main {
        width: 92px;
        height: 92px;
        font-size: 42px;
        animation: dice-result-pop 0.7s ease-out both;
      }

      .dice-result.small {
        width: 54px;
        height: 54px;
        font-size: 24px;
        opacity: 0.72;
      }

      .winner-card {
        width: min(190px, 42%);
        min-width: 148px;
        display: grid;
        justify-items: center;
        gap: 8px;
        padding: 18px 16px;
        border-radius: 36px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.14);
        box-shadow: 0 14px 30px rgba(2, 48, 71, 0.22);
      }

      .winner-avatar {
        width: 74px;
        height: 74px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        object-fit: cover;
        background: rgba(202, 240, 248, 0.22);
        color: #f8fafc;
        font-size: 30px;
        font-weight: 900;
      }

      .winner-meta {
        color: #cbd5e1;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .suspense-stage {
        display: grid;
        place-items: center;
        gap: 18px;
        padding: 22px;
        text-align: center;
      }

      .suspense-title {
        color: #caf0f8;
        font-size: 28px;
        font-weight: 900;
      }

      .suspense-subtitle {
        color: #cbd5e1;
        font-size: 14px;
      }

      .dice-stage {
        display: flex;
        gap: 14px;
      }

      .dice {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: #f8fafc;
        color: #008ccb;
        font-size: 34px;
        font-weight: 900;
        animation: dice-roll 0.42s infinite alternate ease-in-out;
      }

      .dice:nth-child(2) {
        animation-delay: 0.12s;
      }

      .dice:nth-child(3) {
        animation-delay: 0.24s;
      }

      .rps-stage {
        display: flex;
        gap: 16px;
      }

      .rps-stage span {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        font-size: 34px;
        animation: rps-pop 0.72s infinite alternate ease-in-out;
      }

      .rps-stage span:nth-child(2) {
        animation-delay: 0.14s;
      }

      .rps-stage span:nth-child(3) {
        animation-delay: 0.28s;
      }

      .vote-stage {
        width: min(84%, 430px);
        display: grid;
        gap: 10px;
      }

      .vote-stage span {
        height: 18px;
        border-radius: 999px;
        background: linear-gradient(90deg, #caf0f8, #008ccb);
        transform-origin: left center;
        animation: vote-fill 0.95s infinite alternate ease-in-out;
      }

      .vote-stage span:nth-child(2) {
        width: 78%;
        animation-delay: 0.12s;
      }

      .vote-stage span:nth-child(3) {
        width: 62%;
        animation-delay: 0.24s;
      }

      .vote-stage span:nth-child(4) {
        width: 88%;
        animation-delay: 0.36s;
      }

      .ladder-stage {
        width: min(82%, 360px);
        height: 138px;
        position: relative;
        border-left: 5px solid rgba(202, 240, 248, 0.88);
        border-right: 5px solid rgba(202, 240, 248, 0.88);
      }

      .ladder-stage span {
        position: absolute;
        left: 0;
        right: 0;
        height: 5px;
        border-radius: 999px;
        background: rgba(202, 240, 248, 0.88);
        animation: ladder-flash 0.8s infinite alternate ease-in-out;
      }

      .ladder-stage span:nth-child(1) {
        top: 20px;
      }

      .ladder-stage span:nth-child(2) {
        top: 52px;
        animation-delay: 0.14s;
      }

      .ladder-stage span:nth-child(3) {
        top: 84px;
        animation-delay: 0.28s;
      }

      .ladder-stage span:nth-child(4) {
        top: 116px;
        animation-delay: 0.42s;
      }

      .race-suspense {
        width: min(92%, 520px);
        display: grid;
        gap: 12px;
      }

      .race-suspense-lane {
        position: relative;
        height: 34px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.18);
        overflow: hidden;
      }

      .race-suspense-runner {
        position: absolute;
        top: 50%;
        left: 8%;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        transform: translateY(-50%);
        background: linear-gradient(135deg, #caf0f8, #008ccb);
        animation: runner-surge 1.15s infinite ease-in-out;
      }

      .race-suspense-lane:nth-child(2) .race-suspense-runner {
        animation-delay: 0.18s;
      }

      .race-suspense-lane:nth-child(3) .race-suspense-runner {
        animation-delay: 0.34s;
      }

      @keyframes dice-roll {
        from {
          transform: translateY(0) rotate(-10deg);
        }
        to {
          transform: translateY(-12px) rotate(14deg);
        }
      }

      @keyframes runner-surge {
        0% {
          left: 8%;
        }
        48% {
          left: 74%;
        }
        100% {
          left: 18%;
        }
      }

      @keyframes rps-pop {
        from {
          transform: translateY(0) scale(0.92);
        }
        to {
          transform: translateY(-10px) scale(1.08);
        }
      }

      @keyframes vote-fill {
        from {
          transform: scaleX(0.42);
        }
        to {
          transform: scaleX(1);
        }
      }

      @keyframes ladder-flash {
        from {
          opacity: 0.45;
          transform: translateX(-8px);
        }
        to {
          opacity: 1;
          transform: translateX(8px);
        }
      }

      @keyframes result-vote-fill {
        from {
          transform: scaleX(0);
          transform-origin: left center;
        }
        to {
          transform: scaleX(1);
          transform-origin: left center;
        }
      }

      @keyframes race-result-first {
        from {
          left: 10%;
        }
        to {
          left: 82%;
        }
      }

      @keyframes race-result-second {
        from {
          left: 10%;
        }
        to {
          left: 68%;
        }
      }

      @keyframes race-result-third {
        from {
          left: 10%;
        }
        to {
          left: 54%;
        }
      }

      @keyframes ladder-result-trace {
        from {
          transform: scaleX(0);
          transform-origin: left center;
        }
        to {
          transform: scaleX(1);
          transform-origin: left center;
        }
      }

      @keyframes dice-result-pop {
        0% {
          transform: rotate(-18deg) scale(0.72);
        }
        70% {
          transform: rotate(8deg) scale(1.12);
        }
        100% {
          transform: rotate(0deg) scale(1);
        }
      }

      @keyframes rps-result-clash {
        from {
          transform: translateX(0) scale(0.84);
          opacity: 0.6;
        }
        to {
          transform: translateX(0) scale(1);
          opacity: 1;
        }
      }

      @keyframes rps-result-win {
        from {
          transform: translateY(10px) scale(0.82);
          opacity: 0;
        }
        to {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }

      .renders {
        display: grid;
        gap: 12px;
        align-content: start;
        border: 1px solid rgba(0, 140, 203, 0.16);
        background: rgba(255, 255, 255, 0.72);
        border-radius: 28px;
        padding: 18px;
      }

      .renders-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .render-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .renders h2 {
        margin: 0;
        font-size: 18px;
      }

      .renders p {
        margin: 4px 0 0;
        color: #407c9e;
        font-size: 13px;
      }

      .render-list {
        display: grid;
        gap: 8px;
      }

      .job-history {
        display: grid;
        gap: 8px;
        margin-top: 4px;
      }

      .job-list {
        display: grid;
        gap: 8px;
      }

      .render-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        border: 1px solid rgba(0, 140, 203, 0.16);
        background: rgba(255, 255, 255, 0.74);
        border-radius: 22px;
        padding: 12px 14px;
      }

      .render-name {
        color: #06324a;
        font-weight: 900;
        overflow-wrap: anywhere;
      }

      .render-meta {
        color: #407c9e;
        font-size: 12px;
        white-space: nowrap;
      }

      .render-download {
        display: inline-block;
        margin-top: 5px;
        color: #00b4d8;
        font-size: 12px;
        font-weight: 800;
        text-decoration: none;
      }

      .render-download:hover {
        text-decoration: underline;
      }

      .job-item {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
        border: 1px solid rgba(0, 140, 203, 0.16);
        background: rgba(255, 255, 255, 0.62);
        border-radius: 999px;
        padding: 10px 12px;
      }

      .job-status {
        min-width: 70px;
        color: #008ccb;
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .job-id,
      .job-time {
        color: #407c9e;
        font-size: 12px;
      }

      .empty-state {
        color: #407c9e;
        border: 1px dashed rgba(0, 140, 203, 0.28);
        border-radius: 22px;
        padding: 14px;
      }

      @media (max-width: 980px) {
        .draw-layout {
          grid-template-columns: 1fr;
        }

        .row {
          grid-template-columns: 36px 1fr;
        }

        .row.head {
          display: none;
        }

        .row input,
        .row button {
          grid-column: 2;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>PickMeMaybe</h1>
        <div class="badge">MANUAL RAFFLE PREVIEW</div>
      </header>
      <main>
        <nav class="tabs" aria-label="PickMeMaybe workflow">
          <button id="tab-input" class="tab-button active" type="button">입력 관리</button>
          <button id="tab-draw" class="tab-button" type="button">추첨 방송</button>
        </nav>
        <section id="panel-input" class="panel tab-panel active">
          <div class="toolbar">
            <button id="add-row" type="button">+ 참가자 추가</button>
            <button id="remove-last-row" type="button">- 마지막 행 제거</button>
            <label>
              당첨 인원
              <input id="winner-count" class="winner-count" type="number" min="1" step="1" value="1" />
            </label>
            <label>
              연출 모드
              <select id="presentation-mode">
                <option value="random">Random</option>
                <option value="dice-roll">Dice roll</option>
                <option value="rock-paper-scissors">Rock paper scissors</option>
                <option value="vote-count">Vote count</option>
                <option value="running-race">Running race</option>
                <option value="ladder-game">Ladder game</option>
              </select>
            </label>
            <label class="checkbox-label">
              <input id="allow-previous-winners" type="checkbox" checked />
              과거 당첨자 허용
            </label>
            <button id="run-preview" class="primary" type="button">추첨 실행</button>
          </div>
          <div class="status" id="api-status">
            <span class="status-dot"></span>
            <span><strong>API 상태</strong> 확인 중</span>
          </div>
          <textarea id="paste-roster" placeholder="Excel에서 이름, 이메일, 부서, 응모자산, 입력시간 열을 복사해 붙여넣으세요."></textarea>
          <div class="toolbar">
            <button id="apply-paste" type="button">붙여넣기 명단 적용</button>
            <label>
              Excel 파일
              <input id="roster-file" type="file" accept=".xlsx,.xls" />
            </label>
            <button id="apply-file" type="button">Excel 파일 적용</button>
          </div>
          <div class="table" id="participant-table"></div>
          <div class="error" id="error-message"></div>
          <section class="resource-panel">
            <div class="history-title">Face resources</div>
            <div class="resource-summary" id="resource-summary"></div>
          </section>
          <section class="asset-match-panel">
            <div class="history-title">Asset matches</div>
            <div class="asset-match-summary" id="asset-match-summary"></div>
            <div class="asset-match-list" id="asset-match-list"></div>
          </section>
          <div class="history" id="history"></div>
        </section>
        <section id="panel-draw" class="panel tab-panel">
          <div class="draw-layout">
            <div class="preview" id="preview"></div>
            <section class="renders">
              <div class="renders-header">
                <div>
                  <h2>Render outputs</h2>
                  <p>Generated MP4 files from the local render pipeline.</p>
                </div>
                <div class="render-actions">
                  <button id="render-latest" class="primary" type="button">Render latest</button>
                  <button id="refresh-renders" type="button">Refresh</button>
                </div>
              </div>
              <div class="render-list" id="render-list"></div>
              <div class="job-history">
                <div class="history-title">Render job history</div>
                <div class="job-list" id="render-job-list"></div>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="../../dist/apps/web/src/index.js"></script>
  </body>
</html>
